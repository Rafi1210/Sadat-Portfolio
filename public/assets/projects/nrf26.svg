  <g>
    <rect x="840" y="160" width="320" height="320" rx="20" fill="#111318"/>
    <text x="860" y="190" font-family="JetBrains Mono, monospace" font-size="10" fill="#22D3EE" letter-spacing="2">SIGNAL SURGE · ARCADE</text>
    <g stroke="rgba(108,99,255,0.18)" stroke-width="1">
