      <circle cx="496" cy="252" r="10" fill="#6C63FF"/>
      <text x="540" y="258">Team Mech-a</text>
      <text x="800" y="258" text-anchor="end">98.4</text>
      <line x1="460" y1="276" x2="800" y2="276" stroke="#F1F3F5"/>
      <text x="460" y="300">02</text>
      <circle cx="496" cy="294" r="10" fill="#FF7AC6"/>
      <text x="540" y="300">RoboBoys</text>
      <text x="800" y="300" text-anchor="end">96.1</text>
      <line x1="460" y1="318" x2="800" y2="318" stroke="#F1F3F5"/>
      <text x="460" y="342">03</text>
      <circle cx="496" cy="336" r="10" fill="#22D3EE"/>
      <text x="540" y="342">ByteForce</text>
      <text x="800" y="342" text-anchor="end">94.7</text>
      <line x1="460" y1="360" x2="800" y2="360" stroke="#F1F3F5"/>
      <text x="460" y="384">04</text>
      <circle cx="496" cy="378" r="10" fill="#A3FF6C"/>
      <text x="540" y="384">Pixel Pirates</text>
      <text x="800" y="384" text-anchor="end">93.2</text>
      <line x1="460" y1="402" x2="800" y2="402" stroke="#F1F3F5"/>
      <text x="460" y="426">05</text>
      <circle cx="496" cy="420" r="10" fill="#FFB86B"/>
      <text x="540" y="426">Circuit Squad</text>
      <text x="800" y="426" text-anchor="end">91.8</text>
