    <circle cx="900" cy="240" r="10" fill="#22D3EE"/>
    <circle cx="980" cy="280" r="10" fill="#FF7AC6"/>
    <circle cx="1060" cy="340" r="10" fill="#6C63FF"/>
    <circle cx="940" cy="380" r="10" fill="#A3FF6C"/>
    <polyline points="900,240 940,260 980,280 1020,310 1060,340" fill="none" stroke="url(#nGrad)" stroke-width="3" stroke-linecap="round"/>
    <text x="860" y="460" font-family="JetBrains Mono, monospace" font-size="10" fill="rgba(255,255,255,0.6)" letter-spacing="2">SCORE · 12,480</text>
