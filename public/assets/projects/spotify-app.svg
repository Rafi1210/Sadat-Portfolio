    <text x="412" y="334" font-family="Inter, sans-serif" font-size="10" fill="#8A919D">M83</text>
    <text x="1040" y="328" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#1DB954">sim 0.91</text>
    <rect x="360" y="352" width="700" height="44" rx="10" fill="#222"/>
    <circle cx="384" cy="374" r="14" fill="#22D3EE"/>
