    <rect x="1000" y="568" width="140" height="48" rx="14" fill="#111318"/>
    <text x="1070" y="598" text-anchor="middle" font-family="Sora, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">View recap →</text>
  </g>

  <text x="1140" y="700" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#5F6673">NRF26 / event platform</text>
