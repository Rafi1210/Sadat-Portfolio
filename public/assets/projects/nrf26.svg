<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="NRF26 event platform">
  <defs>
    <linearGradient id="nBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6F0"/>
      <stop offset="1" stop-color="#F0F0FF"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#FF7AC6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="nGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(17,19,24,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="url(#nBg)"/>
  <rect width="1200" height="720" fill="url(#nGrid)"/>

  <g>
    <rect x="40" y="40" width="1120" height="100" rx="20" fill="#111318"/>
    <rect x="40" y="40" width="1120" height="100" rx="20" fill="url(#nGrad)" opacity="0.18"/>
    <text x="68" y="84" font-family="JetBrains Mono, monospace" font-size="11" fill="#22D3EE" letter-spacing="3">EWU NATIONAL ROBOFEST 2026</text>
    <text x="68" y="118" font-family="Sora, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">2,000+ builders · 80 institutions · 1 festival</text>
    <circle cx="1100" cy="90" r="30" fill="#FF7AC6"/>
    <text x="1100" y="96" text-anchor="middle" font-family="Sora, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">NRF</text>
    <text x="1100" y="108" text-anchor="middle" font-family="Sora, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">'26</text>
  </g>

  <g>
    <rect x="40" y="160" width="380" height="320" rx="20" fill="#FFFFFF"/>
    <text x="60" y="190" font-family="JetBrains Mono, monospace" font-size="10" fill="#6C63FF" letter-spacing="2">PROFILE FRAME GENERATOR</text>
    <rect x="60" y="210" width="340" height="220" rx="14" fill="url(#nGrad)" opacity="0.85"/>
    <rect x="80" y="230" width="300" height="180" rx="10" fill="rgba(0,0,0,0.25)"/>
    <circle cx="230" cy="300" r="60" fill="#FFFFFF"/>
    <text x="230" y="308" text-anchor="middle" font-family="Sora, sans-serif" font-size="22" font-weight="800" fill="#111318">Rafi</text>
    <text x="230" y="332" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#5F6673" letter-spacing="2">EWU · CSE</text>
    <text x="80" y="380" font-family="Sora, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Compete. Build. Ship.</text>
    <text x="80" y="396" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Generated · 12:04 PM · NRF26</text>
    <rect x="60" y="448" width="160" height="22" rx="6" fill="rgba(108,99,255,0.18)"/>
    <text x="140" y="463" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6C63FF">2,140 frames generated</text>
