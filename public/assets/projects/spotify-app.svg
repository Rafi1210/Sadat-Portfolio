    <text x="1040" y="380" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#1DB954">sim 0.88</text>
  </g>
  <rect x="340" y="420" width="740" height="220" rx="14" fill="#1A1A1A"/>
  <text x="360" y="452" font-family="JetBrains Mono, monospace" font-size="10" fill="#1DB954" letter-spacing="2">FEATURE BREAKDOWN · SEED TRACK</text>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#8A919D">
