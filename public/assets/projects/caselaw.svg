<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="CaseLaw RAG retrieval interface">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0F1A"/>
      <stop offset="1" stop-color="#1A1B2E"/>
    </linearGradient>
    <linearGradient id="cAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#FF7AC6"/>
    </linearGradient>
    <linearGradient id="cGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#cBg)"/>

  <!-- sidebar dark -->
  <g>
    <rect x="0" y="0" width="240" height="720" fill="#0A0B14"/>
    <rect x="40" y="40" width="160" height="40" rx="10" fill="#1F2034"/>
    <circle cx="64" cy="60" r="10" fill="url(#cAcc)"/>
    <text x="84" y="65" font-family="Sora, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">CaseLaw</text>
    <g font-family="Inter, sans-serif" font-size="11" fill="#8A919D">
      <rect x="24" y="120" width="192" height="36" rx="8" fill="#1F2034"/>
      <circle cx="44" cy="138" r="3" fill="#22D3EE"/>
      <text x="58" y="142" fill="#FFFFFF">Federal cases</text>
      <rect x="24" y="166" width="192" height="36" rx="8" fill="transparent"/>
      <circle cx="44" cy="184" r="3" fill="#5F6673"/>
      <text x="58" y="188">State cases</text>
      <rect x="24" y="212" width="192" height="36" rx="8" fill="transparent"/>
      <circle cx="44" cy="230" r="3" fill="#5F6673"/>
      <text x="58" y="234">My queries</text>
    </g>
    <text x="24" y="610" font-family="JetBrains Mono, monospace" font-size="10" fill="#5F6673" letter-spacing="2">POWERED BY</text>
    <text x="24" y="630" font-family="Sora, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">LLaMA 3.3 70B</text>
    <text x="24" y="648" font-family="Inter, sans-serif" font-size="11" fill="#22D3EE">via Groq</text>
  </g>

  <!-- Main panel -->
  <g>
    <rect x="280" y="40" width="880" height="80" rx="14" fill="#1F2034" stroke="rgba(108,99,255,0.4)"/>
    <text x="304" y="68" font-family="Inter, sans-serif" font-size="13" fill="#8A919D">Ask about</text>
    <text x="304" y="96" font-family="Sora, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Fourth Amendment · digital search at border · post-2018 rulings</text>
    <circle cx="1120" cy="80" r="22" fill="url(#cAcc)"/>
    <text x="1120" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">→</text>
  </g>

  <!-- Retrieved snippets -->
  <g>
    <rect x="280" y="150" width="430" height="180" rx="14" fill="#1A1B2E" stroke="rgba(108,99,255,0.25)"/>
    <text x="304" y="180" font-family="JetBrains Mono, monospace" font-size="10" fill="#22D3EE" letter-spacing="2">RETRIEVED · FAISS</text>
    <text x="304" y="210" font-family="Sora, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">United States v. Montoya</text>
    <text x="304" y="232" font-family="Inter, sans-serif" font-size="12" fill="#C7CCD4">...the border-search exception does not extend to...</text>
    <text x="304" y="252" font-family="Inter, sans-serif" font-size="12" fill="#C7CCD4">digital devices absent particularized suspicion...</text>
    <rect x="304" y="280" width="80" height="22" rx="6" fill="rgba(108,99,255,0.18)"/>
    <text x="344" y="295" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9B8CFF">0.92 sim</text>
  </g>
  <g>
    <rect x="730" y="150" width="430" height="180" rx="14" fill="#1A1B2E" stroke="rgba(255,122,198,0.25)"/>
    <text x="754" y="180" font-family="JetBrains Mono, monospace" font-size="10" fill="#FF7AC6" letter-spacing="2">RETRIEVED · BM25</text>
    <text x="754" y="210" font-family="Sora, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Riley v. California</text>
    <text x="754" y="232" font-family="Inter, sans-serif" font-size="12" fill="#C7CCD4">...searches of digital data on a cell phone...</text>
    <text x="754" y="252" font-family="Inter, sans-serif" font-size="12" fill="#C7CCD4">require a warrant even at the border...</text>
    <rect x="754" y="280" width="80" height="22" rx="6" fill="rgba(255,122,198,0.18)"/>
    <text x="794" y="295" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#FF7AC6">BM25 · 18.4</text>
  </g>

  <!-- Answer card -->
  <g>
    <rect x="280" y="360" width="880" height="300" rx="16" fill="url(#cAcc)" opacity="0.95"/>
    <text x="304" y="394" font-family="JetBrains Mono, monospace" font-size="10" fill="rgba(255,255,255,0.7)" letter-spacing="2">LLM ANSWER · GROUNDED</text>
    <text x="304" y="430" font-family="Sora, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Border searches of digital devices</text>
    <g font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.92)">
      <text x="304" y="470">The Supreme Court has held that warrantless search of a cell phone</text>
      <text x="304" y="492">incident to arrest is unconstitutional (Riley, 2014). The border-search</text>
      <text x="304" y="514">doctrine remains in tension with this principle. Recent appellate</text>
      <text x="304" y="536">rulings (Montoya, 2021) suggest a particularized-suspicion threshold...</text>
    </g>
    <rect x="304" y="572" width="280" height="44" rx="10" fill="rgba(0,0,0,0.18)"/>
    <text x="320" y="592" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF">Citations</text>
    <text x="320" y="608" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Riley v. California · U.S. v. Montoya</text>
  </g>

  <text x="1140" y="700" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#5F6673">CaseLaw / Hybrid RAG</text>
</svg>