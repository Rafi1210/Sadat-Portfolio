  <g>
    <rect x="40" y="500" width="1120" height="180" rx="20" fill="#FFFFFF"/>
    <text x="60" y="532" font-family="JetBrains Mono, monospace" font-size="10" fill="#6C63FF" letter-spacing="2">EVENT PLATFORM · NRF26</text>
    <g font-family="Sora, sans-serif" font-size="36" font-weight="800" fill="#111318">
      <text x="60" y="586">2,000<tspan font-size="20" fill="#6C63FF">+</tspan></text>
      <text x="60" y="610" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5F6673">Participants</text>
      <text x="240" y="586">80<tspan font-size="20" fill="#FF7AC6">+</tspan></text>
      <text x="240" y="610" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5F6673">Institutions</text>
      <text x="420" y="586">20<tspan font-size="20" fill="#22D3EE">+</tspan></text>
      <text x="420" y="610" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5F6673">Partners</text>
      <text x="600" y="586">7</text>
      <text x="600" y="610" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5F6673">Event segments</text>
      <text x="780" y="586">5</text>
      <text x="780" y="610" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5F6673">Web tools shipped</text>
