<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Spotify recommendation app detail">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A12"/>
      <stop offset="1" stop-color="#1F1F1F"/>
    </linearGradient>
    <linearGradient id="spAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#0F7A36"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#spBg)"/>
  <rect x="100" y="80" width="1000" height="560" rx="14" fill="#181818"/>
