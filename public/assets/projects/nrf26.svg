      <line x1="860" y1="280" x2="1140" y2="280"/>
      <line x1="860" y1="340" x2="1140" y2="340"/>
      <line x1="860" y1="400" x2="1140" y2="400"/>
      <line x1="900" y1="200" x2="900" y2="420"/>
      <line x1="980" y1="200" x2="980" y2="420"/>
      <line x1="1060" y1="200" x2="1060" y2="420"/>
