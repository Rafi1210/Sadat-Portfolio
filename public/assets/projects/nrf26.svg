    <rect x="460" y="448" width="120" height="22" rx="6" fill="rgba(255,122,198,0.18)"/>
    <text x="520" y="463" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#FF4FB6">● Live · 84 teams</text>
